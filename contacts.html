<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Татьяна Сухачева</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <script>
        (function() {
            var t = localStorage.getItem('siteTheme') || 'green';
            if (t !== 'green') document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root {
            --bg-body: #f5fcf5;
            --container-bg: rgba(255, 255, 255, 0.7);
            --text-main: #2d4a2d;
            --text-heading: #1f3a1f;
            --text-soft: #3f5a3f;
            --text-muted: #4a6a4a;
            --card-bg: #fafffa;
            --card-accent: #ecf7ec;
            --badge-bg: #ddf0dd;
            --badge-bright: #b8e0b8;
            --badge-hover: #c8e6c8;
            --btn-bg: #2f6b2f;
            --btn-bg-hover: #1f531f;
            --border: #d4ecd4;
            --shadow: rgba(0, 40, 0, 0.08);
            --shadow-hover: rgba(0, 50, 0, 0.15);
        }
        html[data-theme="gray"] {
            --bg-body: #f2f2f5; --container-bg: rgba(255,255,255,0.75);
            --text-main: #2a2a2e; --text-heading: #1a1a1e; --text-soft: #4a4a52; --text-muted: #666670;
            --card-bg: #fbfbfd; --card-accent: #e8e8ee;
            --badge-bg: #e5e5eb; --badge-bright: #c8c8d4; --badge-hover: #d8d8e0;
            --btn-bg: #5a5a68; --btn-bg-hover: #40404c;
            --border: #dddde4; --shadow: rgba(0,0,30,0.08); --shadow-hover: rgba(0,0,30,0.15);
        }
        html[data-theme="burgundy"] {
            --bg-body: #fbf3f5; --container-bg: rgba(255,252,253,0.8);
            --text-main: #4a1f28; --text-heading: #6b1f30; --text-soft: #5a2f38; --text-muted: #7a4a55;
            --card-bg: #fdf7f9; --card-accent: #f5e0e5;
            --badge-bg: #f0d5dd; --badge-bright: #d4a0b0; --badge-hover: #e5c0cc;
            --btn-bg: #8b2d3e; --btn-bg-hover: #6b1f30;
            --border: #efd5dd; --shadow: rgba(80,0,20,0.1); --shadow-hover: rgba(80,0,20,0.18);
        }
        html[data-theme="pink"] {
            --bg-body: #fcf5f9; --container-bg: rgba(255,252,254,0.8);
            --text-main: #4a1f38; --text-heading: #6b1f4a; --text-soft: #5a2f48; --text-muted: #8a4a6a;
            --card-bg: #fef9fc; --card-accent: #fae0eb;
            --badge-bg: #f5d5e5; --badge-bright: #e0a0c0; --badge-hover: #efc0d5;
            --btn-bg: #d67ca6; --btn-bg-hover: #b85e88;
            --border: #f0d5e2; --shadow: rgba(80,0,40,0.1); --shadow-hover: rgba(80,0,40,0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            animation: fadeIn 1s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 60px 50px;
            box-shadow: 0 20px 40px var(--shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 500;
            color: var(--text-heading);
            margin-bottom: 20px;
            transition: color 0.5s ease;
        }
        .placeholder-icon { font-size: 4rem; margin-bottom: 20px; }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
            transition: color 0.5s ease;
        }
        .footer .back-link {
            background: var(--badge-bg);
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 500;
            color: var(--text-heading);
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s, color 0.4s;
            font-size: 1rem;
        }
        .footer .back-link:hover { background: var(--badge-hover); transform: scale(1.03); }

        /* Иконка настроек */
        .settings-toggle {
            position: fixed;
            top: 20px; right: 20px;
            width: 52px; height: 52px;
            background: var(--btn-bg);
            border-radius: 50%;
            border: none;
            box-shadow: 0 8px 20px var(--shadow-hover);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 950;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .settings-toggle:hover { transform: scale(1.08); background: var(--btn-bg-hover); }
        .settings-toggle svg { width: 26px; height: 26px; }

        .settings-toggle-tooltip {
            position: fixed;
            top: 26px; right: 82px;
            background: var(--card-bg);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 6px 16px var(--shadow);
            border: 2px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(10px);
            white-space: nowrap;
            z-index: 950;
        }
        .settings-toggle:hover + .settings-toggle-tooltip,
        .settings-toggle:focus + .settings-toggle-tooltip {
            opacity: 1;
            transform: translateX(0);
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(30, 50, 30, 0.5);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            max-width: 500px;
            width: 90%;
            padding: 40px 35px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 30, 0, 0.2);
            position: relative;
            animation: slideUp 0.5s ease;
            max-height: 90vh;
            overflow-y: auto;
            transition: background-color 0.5s;
        }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-close {
            position: absolute;
            top: 16px; right: 22px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text-heading); transform: rotate(90deg); }

        .modal-content h2 {
            font-weight: 500;
            color: var(--text-heading);
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-content .subtext {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .settings-section { margin-bottom: 30px; }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 15px;
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .theme-option {
            background: var(--card-accent);
            border: 3px solid var(--border);
            border-radius: 20px;
            padding: 14px 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-family: inherit;
        }
        .theme-option:hover { transform: translateY(-3px); box-shadow: 0 8px 20px var(--shadow); }
        .theme-option.active { border-color: var(--btn-bg); box-shadow: 0 0 0 3px var(--badge-bg); }
        .theme-option .color-dot {
            width: 32px; height: 32px;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: block;
            box-shadow: inset 0 -3px 6px rgba(0,0,0,0.1), 0 3px 8px rgba(0,0,0,0.1);
        }
        .theme-option .color-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.2;
        }

        .dot-green { background: linear-gradient(135deg, #f5fcf5 50%, #2f6b2f 50%); }
        .dot-gray { background: linear-gradient(135deg, #f2f2f5 50%, #5a5a68 50%); }
        .dot-burgundy { background: linear-gradient(135deg, #fbf3f5 50%, #8b2d3e 50%); }
        .dot-pink { background: linear-gradient(135deg, #fcf5f9 50%, #d67ca6 50%); }

        .sound-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-accent);
            padding: 14px 20px;
            border-radius: 20px;
        }
        .sound-toggle-row .sound-label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1rem;
        }
        .sound-switch {
            position: relative;
            width: 54px;
            height: 30px;
            background: var(--badge-bright);
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
            padding: 0;
            flex-shrink: 0;
        }
        .sound-switch::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 24px; height: 24px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .sound-switch.on { background: var(--btn-bg); }
        .sound-switch.on::after { transform: translateX(24px); }

        @media (max-width: 700px) {
            .container { padding: 40px 25px; }
            h1 { font-size: 1.9rem; }
            .settings-toggle { top: 15px; right: 15px; width: 46px; height: 46px; }
            .settings-toggle-tooltip { display: none; }
            .theme-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<!-- ИКОНКА НАСТРОЕК -->
<button class="settings-toggle" id="settingsToggle" aria-label="Персональная настройка сайта">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="7.5" r="3.8" fill="currentColor"/>
        <path d="M3.8 20.2c0-4.3 3.7-7.5 8.2-7.5s8.2 3.2 8.2 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </svg>
</button>
<div class="settings-toggle-tooltip">Персональная настройка сайта</div>

<div class="container">
    <div class="placeholder-icon">📞</div>
    <h1>Контакты</h1>
    <p class="subtitle">Здесь скоро появятся контакты для связи. Мы уже работаем над этим!</p>
    <div class="footer">
        <a href="index.html" class="back-link">← На главную</a>
    </div>
</div>

<!-- МОДАЛКА НАСТРОЕК -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <span class="modal-close" id="closeSettingsBtn">&times;</span>
        <h2>Персональная настройка</h2>
        <p class="subtext">Выберите то, что вам удобно 🌿</p>

        <div class="settings-section">
            <h3>🎨 Тема оформления</h3>
            <div class="theme-options">
                <button class="theme-option" data-theme="green">
                    <span class="color-dot dot-green"></span>
                    <span class="color-name">Системная</span>
                </button>
                <button class="theme-option" data-theme="gray">
                    <span class="color-dot dot-gray"></span>
                    <span class="color-name">Светло-серая</span>
                </button>
                <button class="theme-option" data-theme="burgundy">
                    <span class="color-dot dot-burgundy"></span>
                    <span class="color-name">Бордовая</span>
                </button>
                <button class="theme-option" data-theme="pink">
                    <span class="color-dot dot-pink"></span>
                    <span class="color-name">Розовая</span>
                </button>
            </div>
        </div>

        <div class="settings-section">
            <h3>🔔 Звук уведомлений</h3>
            <div class="sound-toggle-row">
                <span class="sound-label">Звук при нажатии на кнопки</span>
                <button class="sound-switch" id="soundSwitch" aria-label="Переключить звук"></button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const settingsModal = document.getElementById('settingsModal');
        const settingsToggle = document.getElementById('settingsToggle');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const themeOptions = document.querySelectorAll('.theme-option');
        const soundSwitch = document.getElementById('soundSwitch');

        let currentTheme = localStorage.getItem('siteTheme') || 'green';
        let soundEnabled = localStorage.getItem('siteSound') !== 'false';

        function applyTheme(theme) {
            currentTheme = theme;
            if (theme === 'green') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            themeOptions.forEach(opt => {
                opt.classList.toggle('active', opt.getAttribute('data-theme') === theme);
            });
            localStorage.setItem('siteTheme', theme);
        }

        function applySound() {
            soundSwitch.classList.toggle('on', soundEnabled);
            soundSwitch.setAttribute('aria-pressed', soundEnabled);
            localStorage.setItem('siteSound', soundEnabled ? 'true' : 'false');
        }

        let audioCtx = null;
        function playClickSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.13);
            } catch (err) {}
        }

        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .back-link, .theme-option, .sound-switch');
            if (target && !target.disabled) playClickSound();
        }, true);

        settingsToggle.addEventListener('click', function() {
            settingsModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        closeSettingsBtn.addEventListener('click', function() {
            settingsModal.classList.remove('active');
            document.body.style.overflow = '';
        });
        settingsModal.addEventListener('click', function(e) {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        themeOptions.forEach(opt => {
            opt.addEventListener('click', function() {
                applyTheme(this.getAttribute('data-theme'));
            });
        });

        soundSwitch.addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            applySound();
            if (soundEnabled) playClickSound();
        });

        applyTheme(currentTheme);
        applySound();
    })();
</script>

</body>
</html>
